<div class="sticky top-0 z-50">
  <nav class="bg-bg-sidebar border-b border-divider h-16 px-6 flex items-center justify-between shadow-sm font-sans">

    <div class="flex items-center gap-8">

      <a href="#"
        class="text-text-header text-xl font-bold tracking-wide flex items-center gap-2 hover:opacity-80 transition-opacity">
        <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-black text-sm">
          MF
        </div>
        Make Frineds
      </a>

      <div class="hidden md:flex items-center gap-2">
        <button (click)="setSection('matches')" class="px-4 py-2 rounded-md font-medium transition-all duration-200"
          [ngClass]="{
              'bg-primary text-text-header shadow-sm': activeSection === 'matches',
              'text-text-muted hover:bg-bg-hover hover:text-text-normal': activeSection !== 'matches'
              }">
          Matches
        </button>

        <button (click)="setSection('messages')" class="px-4 py-2 rounded-md font-medium transition-all duration-200"
          [ngClass]="{
              'bg-primary text-text-header shadow-sm': activeSection === 'messages',
              'text-text-muted hover:bg-bg-hover hover:text-text-normal': activeSection !== 'messages'
              }">
          Messages
        </button>

        <button (click)="setSection('lists')" class="px-4 py-2 rounded-md font-medium transition-all duration-200"
          [ngClass]="{
              'bg-primary text-text-header shadow-sm': activeSection === 'lists',
              'text-text-muted hover:bg-bg-hover hover:text-text-normal': activeSection !== 'lists'
              }">
          Lists
        </button>
      </div>
    </div>

    @if (accountService.currentUser(); as user) {
    <div class="hidden lg:flex items-center gap-4 bg-bg-input px-3 py-1.5 rounded-full border border-divider shadow-sm">
      <div class="flex items-center gap-3 pr-2 border-r border-divider/50">
        <img [src]="user.imageUrl || 'user.png'" alt="User Profile"
          class="w-8 h-8 rounded-full border border-divider/30 object-cover ring-1 ring-primary/20">
        <span class="text-text-normal font-semibold text-sm">Welcome, {{ user.displayName
          }}</span>
      </div>
      <button (click)="logout()"
        class="group flex items-center justify-center p-1.5 rounded-full hover:bg-status-dnd/10 text-text-muted hover:text-status-dnd transition-all duration-300 active:scale-90"
        title="Logout">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
    } @else {
    <div class="hidden lg:flex items-center gap-2">
      <button (click)="openLogin()"
        class="bg-primary hover:bg-primary-hover text-white text-sm font-bold px-6 py-2.5 rounded-full transition-all duration-300 shadow-lg shadow-primary/20 active:scale-95">
        Log In
      </button>
    </div>
    }

    <button (click)="toggleMenu()" class="lg:hidden text-text-normal hover:text-text-header transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </nav>

  <!-- Mobile Menu -->
  @if (isMenuOpen()) {
  <div class="lg:hidden bg-bg-sidebar border-b border-divider px-6 py-4 flex flex-col gap-4 shadow-lg">
    <div class="flex flex-col gap-1">
      <button (click)="setSection('matches')" class="w-full text-left px-4 py-3 rounded-md font-medium transition-all"
        [ngClass]="{
              'bg-primary text-text-header': activeSection === 'matches',
              'text-text-muted hover:bg-bg-hover': activeSection !== 'matches'
              }">
        Matches
      </button>

      <button (click)="setSection('messages')" class="w-full text-left px-4 py-3 rounded-md font-medium transition-all"
        [ngClass]="{
              'bg-primary text-text-header': activeSection === 'messages',
              'text-text-muted hover:bg-bg-hover': activeSection !== 'messages'
              }">
        Messages
      </button>

      <button (click)="setSection('lists')" class="w-full text-left px-4 py-3 rounded-md font-medium transition-all"
        [ngClass]="{
              'bg-primary text-text-header': activeSection === 'lists',
              'text-text-muted hover:bg-bg-hover': activeSection !== 'lists'
              }">
        Lists
      </button>
    </div>

    <div class="h-px bg-divider mx-4"></div>

    @if (accountService.currentUser()) {
    <div class="flex flex-col gap-4 px-4">
      <div class="flex items-center justify-between bg-bg-input/50 p-4 rounded-xl border border-divider">
        <div class="flex items-center gap-3">
          <img [src]="accountService.currentUser()?.imageUrl || 'user.png'" alt="User Profile"
            class="w-12 h-12 rounded-full border-2 border-primary/20 object-cover">
          <div class="flex flex-col">
            <span class="text-text-header font-bold text-lg leading-tight">{{ accountService.currentUser()?.displayName
              }}</span>
            <span class="text-text-muted text-xs">Logged in</span>
          </div>
        </div>
        <button (click)="logout()"
          class="flex items-center justify-center p-3 rounded-full bg-status-dnd/10 text-status-dnd hover:bg-status-dnd/20 transition-all duration-300 active:scale-95 shadow-sm"
          title="Logout">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
    } @else {
    <div class="px-4 pb-2">
      <button (click)="openLogin()"
        class="w-full bg-primary hover:bg-primary-hover text-white text-base font-bold py-4 rounded-2xl transition-all duration-300 shadow-xl shadow-primary/20 active:scale-95">
        Log In
      </button>
    </div>
    }
  </div>
  }
</div>
