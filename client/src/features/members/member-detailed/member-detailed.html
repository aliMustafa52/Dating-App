@if (member()) {
<div class="h-full bg-bg-main p-6 overflow-y-auto">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
    <!-- Sidebar / Profile Summary -->
    <div class="w-full md:w-1/3 lg:w-1/4">
      <app-member-sidebar [member]="member()!"></app-member-sidebar>
    </div>

    <!-- Main Content -->
    <div class="w-full md:w-2/3 lg:w-3/4 flex flex-col gap-6">
      <!-- About -->
      <div class="bg-bg-sidebar rounded-xl border border-divider p-6 shadow-sm">
        <h3 class="text-xl font-bold text-text-header mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          About {{member()?.displayName}}
        </h3>
        <p class="text-text-normal leading-relaxed whitespace-pre-line">{{member()?.description || 'No description provided.'}}</p>
      </div>

      <!-- Photos -->
      <app-member-photos [photos]="member()!.photos"></app-member-photos>
    </div>
  </div>
</div>
} @else {
<div class="h-full bg-bg-main flex items-center justify-center">
  <div class="w-12 h-12 border-4 border-divider border-t-primary rounded-full animate-spin"></div>
</div>
}
