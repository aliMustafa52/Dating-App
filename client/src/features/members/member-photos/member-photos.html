<div class="bg-bg-sidebar rounded-xl border border-divider p-6 shadow-sm">
  <h3 class="text-xl font-bold text-text-header mb-4 flex items-center gap-2">
    <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>
    Photos
  </h3>
  
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
    @for (photo of photos(); track photo.id) {
      <div class="relative aspect-square rounded-lg overflow-hidden border border-divider bg-bg-server">
        <img [src]="photo.url" alt="Photo" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
      </div>
    } @empty {
      <div class="col-span-full py-8 text-center text-text-muted bg-bg-server rounded-lg border border-dashed border-divider">
        No photos available.
      </div>
    }
  </div>
</div>
