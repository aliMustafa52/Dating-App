<app-nav />

@if (!accountService.currentUser()) {
<app-home />
} @else {
<div class="min-h-screen bg-bg-main p-8">

  <div class="mb-8 flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-text-header">Community Members</h2>
      <p class="mt-1 text-sm text-text-muted">Found {{ members().length }} active Members.</p>
    </div>
  </div>

  <ul role="list" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (user of members(); track user.id) {
    <li
      class="group relative flex flex-col items-center rounded-2xl bg-bg-sidebar p-6 border border-divider shadow-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:border-primary/30">

      <div class="absolute top-4 right-4">
        @if(user.id === 'ali-id') {
        <span class="flex h-3 w-3 relative">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-status-online opacity-75"></span>
          <span
            class="relative inline-flex rounded-full h-3 w-3 bg-status-online border-2 border-bg-sidebar"></span>
        </span>
        } @else {
        <span class="inline-block h-3 w-3 rounded-full bg-status-offline border-2 border-bg-sidebar"></span>
        }
      </div>

      <div class="relative mb-4">
        <img class="h-28 w-28 rounded-full border-4 border-bg-main shadow-sm object-cover" src="/user.png"
          alt="{{ user.displayName }}">
        <div class="absolute bottom-0 right-0 bg-bg-sidebar rounded-full p-1">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-primary">
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
              clip-rule="evenodd" />
          </svg>
        </div>
      </div>

      <h3 class="mb-1 text-xl font-bold text-text-header truncate max-w-full">
        {{ user.displayName }}
      </h3>
      <p class="mb-6 text-sm font-medium text-text-muted flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 mr-1.5 opacity-70">
          <path d="M3 4a2 2 0 00-2 2v1.161l8.441 4.221a1.25 1.25 0 001.118 0L19 7.162V6a2 2 0 00-2-2H3z" />
          <path d="M19 8.839l-7.77 3.885a2.75 2.75 0 01-2.46 0L1 8.839V14a2 2 0 002 2h14a2 2 0 002-2V8.839z" />
        </svg>
        {{ user.email }}
      </p>

      <div class="mt-auto w-full flex gap-3">
        <button
          class="flex-1 rounded-xl bg-primary py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-hover transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
          Message
        </button>
        <button
          class="rounded-xl bg-bg-input p-2.5 text-text-muted hover:text-text-normal hover:bg-bg-hover transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
            <path
              d="M3 10a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zM8.5 10a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zM15.5 8.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" />
          </svg>
        </button>
      </div>

    </li>
    }
  </ul>
</div>
}
